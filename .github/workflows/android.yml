
name: G-rise Android APK Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'G_RISE_AUH_RISE_FREE.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build G-rise APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract G-rise source
        run: |
          unzip -q G_RISE_AUH_RISE_FREE.zip

      - name: Prepare Android project
        run: |
          bash GLOBAL_CHAT_P2P/android/prepare.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Python tests
        continue-on-error: true
        run: |
          python -m unittest discover \
            -s GLOBAL_CHAT_P2P \
            -p "test*.py"

      - name: Build Android APKs
        run: |
          gradle -p GLOBAL_CHAT_P2P/android \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Upload G-rise Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: g-rise-chat-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/chat/debug/*.apk
          if-no-files-found: error

      - name: Upload G-rise Node APK
        uses: actions/upload-artifact@v4
        with:
          name: g-rise-node-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/node/debug/*.apk
          if-no-files-found: error
