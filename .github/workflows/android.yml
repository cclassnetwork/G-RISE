
name: Build G-rise Free Features APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'G_RISE_AUH_RISE_FREE_FEATURES.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build G-rise Android APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 4. Verify Java and Python
      - name: Verify build environment
        run: |
          java -version
          python --version
          python3.12 --version

      # 5. Install system dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      # 6. Extract G-rise source
      - name: Extract G-rise source
        run: |
          test -f G_RISE_AUH_RISE_FREE_FEATURES.zip
          unzip -q G_RISE_AUH_RISE_FREE_FEATURES.zip

      # 7. Prepare Android project
      - name: Prepare Android project
        run: |
          bash GLOBAL_CHAT_P2P/android/prepare.sh

      # 8. Set up Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 9. Run Python tests
      - name: Run Python tests
        run: |
          python -m unittest discover \
            -s GLOBAL_CHAT_P2P \
            -p "test*.py"

      # 10. Clean old build files
      - name: Clean previous Android build
        run: |
          rm -rf GLOBAL_CHAT_P2P/android/.gradle
          rm -rf GLOBAL_CHAT_P2P/android/build
          rm -rf GLOBAL_CHAT_P2P/android/app/build

      # 11. Build Android APKs
      - name: Build Android APKs
        run: |
          gradle -p GLOBAL_CHAT_P2P/android clean :app:assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace

      # 12. Upload Chat APK
      - name: Upload G-rise Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: g-rise-chat-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/chat/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Upload Node APK
      - name: Upload G-rise Node APK
        uses: actions/upload-artifact@v4
        with:
          name: g-rise-node-apk
          path: GLOBAL_CHAT_P2P/android/app/build/outputs/apk/node/debug/*.apk
          if-no-files-found: error
          retention-days: 14
